// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// This project lives under OneDrive (C:\Users\...\OneDrive\Desktop\closeconnect) --
// OneDrive's background sync repeatedly locks files under each module's own
// build/ directory while Gradle is mid-write, failing mergeDebugResources
// with "Unable to delete directory" (seen twice, different files each time,
// which is the signature of an external process walking the tree rather
// than a real Gradle bug). Relocating every module's build output outside
// the synced tree entirely removes the conflict instead of retrying around it.
def externalBuildDir = new File("C:/android-build-cache/closeconnect")
rootProject.buildDir = new File(externalBuildDir, "root")
subprojects {
    buildDir = new File(externalBuildDir, project.name)
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
